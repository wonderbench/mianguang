name: Frontend design review

on:
  push:
    branches: [codex/platform-frontend-unslop]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare browser and Django template renderer
        run: |
          python -m pip install --require-hashes -r platform/requirements.txt
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Preserve original templates and assets
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base = '0f1f18fada4ac9a1b6a3e57691aa94fc1a8c9307'
          prefix = 'platform/app/monitoring/'
          paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', base, prefix+'templates', prefix+'static'], text=True).splitlines()
          for path in paths:
              target = Path('.design-preview/before') / path.removeprefix(prefix)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', f'{base}:{path}']))
          PY
      - name: Render and check desktop and phone pages
        run: |
          python platform/tools/_design_preview.py > preview-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8861/login/ > /dev/null; then break; fi
            sleep 1
          done
          node platform/tools/_design_capture.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-design-review
          path: |
            artifacts/
            preview-server.log
          if-no-files-found: error
