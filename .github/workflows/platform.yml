name: Platform

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform.yml"]
  workflow_dispatch:
    inputs:
      capacity_seed_rows:
        description: Synthetic historical rows for the 30-second capacity run
        type: choice
        options: ["6000", "6048000"]
        default: "6000"

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: mianguang
          POSTGRES_USER: mianguang
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mianguang -d mianguang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: mianguang
      PGUSER: mianguang
      PGPASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r platform/requirements.txt
      - name: Validate telemetry contract and document links
        run: python platform/tools/validate_contract.py
      - name: Check Django configuration
        working-directory: platform/app
        run: python manage.py check
      - name: Check migrations are committed
        working-directory: platform/app
        run: python manage.py makemigrations --check --dry-run
      - name: Run PostgreSQL integration tests
        working-directory: platform/app
        run: python manage.py test monitoring.tests --verbosity 2

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install backup encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Build, ingest synthetic data, back up and restore isolated containers
        run: platform/deploy/smoke.sh
        env:
          CAPACITY_REPORT: ${{ github.workspace }}/capacity-smoke.json
          CAPACITY_SEED_ROWS: ${{ inputs.capacity_seed_rows || '6048000' }}
      - name: Preserve measured capacity smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capacity-smoke
          path: capacity-smoke.json
          if-no-files-found: warn
