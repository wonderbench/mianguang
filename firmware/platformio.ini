[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D MIANGUANG_VERSION=\"0.2.0\"

[env:xiao_esp32c3_platform]
extends = env:xiao_esp32c3
lib_deps = symlink://../platform/firmware
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D MIANGUANG_PLATFORM=1
    -D MIANGUANG_VERSION=\"0.3.0-dev\"

