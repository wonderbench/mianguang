user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format minimal '$request_id $request_method $uri $status $request_time';
    access_log /dev/stdout minimal;
    server_tokens off;
    sendfile on;
    client_body_timeout 10s;

    limit_req_zone $binary_remote_addr zone=telemetry:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_status 429;

    upstream mianguang { server app:8000; }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # All personnel routes, including static files, inherit this allowlist.
        include /etc/nginx/staff-networks.conf;

        location = /api/device/v1/telemetry {
            # This exact route is reachable outside the personnel network.
            allow all;
            limit_except POST { deny all; }
            client_max_body_size 4k;
            limit_req zone=telemetry burst=200 nodelay;
            include /etc/nginx/mianguang-proxy.conf;
            proxy_pass http://mianguang;
        }

        location = /healthz { return 404; }

        location ~ ^/(admin/)?login/$ {
            limit_req zone=login burst=10 nodelay;
            include /etc/nginx/mianguang-proxy.conf;
            proxy_pass http://mianguang;
        }

        location /static/ { alias /srv/static/; }

        location / {
            include /etc/nginx/mianguang-proxy.conf;
            proxy_pass http://mianguang;
        }
    }
}
