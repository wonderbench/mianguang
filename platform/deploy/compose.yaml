name: mianguang

services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-mianguang}
      PGUSER: ${PGUSER:-mianguang}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-app.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$PGUSER" -d "$$PGDATABASE"']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
      DJANGO_DEBUG: "false"
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Asia/Shanghai}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-mianguang}
      PGUSER: ${PGUSER:-mianguang}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - static_files:/app/staticfiles
    networks: [web, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; r = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r, timeout=5).read()"
      interval: 15s
      timeout: 6s
      retries: 4

  nginx:
    image: nginx:1.30.6@sha256:66b50d24288dba67f3d000b31223daefc4868c58d29aaacb6a4ff9771597b5eb
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/mianguang-proxy.conf:ro
      - ./staff-networks.conf:/etc/nginx/staff-networks.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - static_files:/srv/static:ro
    networks: [web]
    depends_on:
      app:
        condition: service_healthy

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
  static_files:
