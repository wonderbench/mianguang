{% extends 'monitoring/base.html' %}
{% block title %}登录 · 眠光平台{% endblock %}
{% block content %}
<section class="login-panel panel">
  <p class="eyebrow">眠光平台</p>
  <h1>登录观测平台</h1>
  <p class="muted">使用管理员分配的账号。</p>
  {% if form.errors %}<p class="notice" role="alert">账号或密码不正确，请重试。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">账号</label>
    <input type="text" name="username" id="id_username" autocomplete="username" maxlength="150" autofocus required>
    <label for="id_password">密码</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">登录</button>
  </form>
</section>
{% endblock %}
